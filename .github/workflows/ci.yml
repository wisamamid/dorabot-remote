name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build every workspace
        run: npm run build
      - name: Typecheck every workspace
        run: npm run typecheck
      - name: Test every workspace
        run: npm test

  ios:
    # The app has to keep building for a real device, not just typechecking.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @dorabot-remote/protocol
      - run: npm run build -w @dorabot-remote/mobile
      - name: Sync Capacitor
        working-directory: packages/mobile
        run: npx cap sync ios
      - name: Build for simulator
        working-directory: packages/mobile/ios/App
        run: |
          xcodebuild -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
